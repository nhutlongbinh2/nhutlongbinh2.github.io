<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển Đổi Âm Thanh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            background: #f0f4ff;
            border-color: #764ba2;
        }
        
        .upload-area.dragover {
            background: #e8edff;
            border-color: #764ba2;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .format-selector {
            margin: 20px 0;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .quality-selector {
            margin: 15px 0;
            display: none;
        }
        
        .quality-selector.show {
            display: block;
        }
        
        .convert-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 20px;
        }
        
        .convert-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        
        .convert-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .file-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            display: none;
        }
        
        .file-info.show {
            display: block;
        }
        
        .file-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .file-size {
            color: #666;
            font-size: 14px;
        }
        
        .progress-container {
            margin: 20px 0;
            display: none;
        }
        
        .progress-container.show {
            display: block;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }
        
        .progress-text {
            text-align: center;
            color: #666;
            font-size: 14px;
        }
        
        .result {
            display: none;
            margin-top: 20px;
            text-align: center;
        }
        
        .result.show {
            display: block;
        }
        
        .download-btn {
            display: inline-block;
            padding: 12px 30px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        .download-btn:hover {
            background: #218838;
        }
        
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        
        .status.show {
            display: block;
        }
        
        .status.error {
            background: #fee;
            color: #c00;
        }
        
        .status.success {
            background: #efe;
            color: #070;
        }
        
        .status.info {
            background: #e7f3ff;
            color: #0066cc;
        }
        
        .tip {
            background: #fff9e6;
            border-left: 4px solid #ffc107;
            padding: 12px;
            margin-top: 15px;
            border-radius: 5px;
            font-size: 13px;
            color: #856404;
            display: none;
        }
        
        .tip.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Chuyển Đổi Âm Thanh & Video</h1>
        <p class="subtitle">Hỗ trợ: WAV, MP3, OGG, AAC, M4A, WMA, WebM, MP4, AVI, MKV</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <p><strong>Nhấp để chọn file</strong> hoặc kéo thả file vào đây</p>
            <p style="font-size: 12px; color: #999; margin-top: 10px;">Hỗ trợ file âm thanh & video lớn tới 200MB</p>
        </div>
        
        <input type="file" id="fileInput" accept="audio/*,video/*">
        
        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName"></div>
            <div class="file-size" id="fileSize"></div>
        </div>
        
        <div class="tip" id="tip">
            💡 <strong>File lớn:</strong> Quá trình xử lý có thể mất 30-60 giây. Vui lòng kiên nhẫn chờ đợi!
        </div>
        
        <div class="format-selector">
            <label for="outputFormat">Chọn định dạng đầu ra:</label>
            <select id="outputFormat">
                <option value="wav">WAV (chất lượng gốc, file lớn)</option>
                <option value="mp3">MP3 (phổ biến, file nhỏ)</option>
                <option value="ogg">OGG Vorbis (chất lượng tốt)</option>
                <option value="webm">WebM Opus (file rất nhỏ)</option>
            </select>
        </div>
        
        <button class="convert-btn" id="convertBtn" disabled>Chuyển Đổi</button>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Đang xử lý...</div>
        </div>
        
        <div class="status" id="status"></div>
        
        <div class="result" id="result">
            <a href="#" class="download-btn" id="downloadBtn" download>⬇️ Tải Xuống File</a>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const convertBtn = document.getElementById('convertBtn');
        const outputFormat = document.getElementById('outputFormat');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const status = document.getElementById('status');
        const result = document.getElementById('result');
        const downloadBtn = document.getElementById('downloadBtn');
        const tip = document.getElementById('tip');
        
        let selectedFile = null;

        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });
        
        function handleFile(file) {
            if (!file.type.startsWith('audio/') && !file.type.startsWith('video/')) {
                showStatus('⚠️ Vui lòng chọn file âm thanh hoặc video hợp lệ!', 'error');
                return;
            }
            
            selectedFile = file;
            const sizeMB = (file.size / 1024 / 1024).toFixed(2);
            const fileType = file.type.startsWith('video/') ? '🎬 Video' : '🎵 Audio';
            fileName.textContent = `${fileType}: ${file.name}`;
            fileSize.textContent = `Kích thước: ${sizeMB} MB`;
            fileInfo.classList.add('show');
            convertBtn.disabled = false;
            result.classList.remove('show');
            status.classList.remove('show');
            
            // Show tip for large files
            if (file.size > 50 * 1024 * 1024) {
                tip.classList.add('show');
            } else {
                tip.classList.remove('show');
            }
        }
        
        convertBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            convertBtn.disabled = true;
            progressContainer.classList.add('show');
            result.classList.remove('show');
            updateProgress(0, 'Đang tải file...');
            
            try {
                const format = outputFormat.value;
                const isVideo = selectedFile.type.startsWith('video/');
                
                updateProgress(10, 'Đang tải file...');
                
                // For video/WebM files, use different approach
                if (isVideo || selectedFile.name.toLowerCase().endsWith('.webm')) {
                    const blob = await convertVideoToAudio(selectedFile, format);
                    
                    updateProgress(100, 'Chuyển đổi thành công!');
                    
                    // Create download
                    const downloadUrl = URL.createObjectURL(blob);
                    const originalName = selectedFile.name.replace(/\.[^/.]+$/, '');
                    downloadBtn.href = downloadUrl;
                    downloadBtn.download = `${originalName}.${format}`;
                    
                    result.classList.add('show');
                    showStatus('✅ Hoàn tất! File đã sẵn sàng tải xuống.', 'success');
                    
                    setTimeout(() => {
                        progressContainer.classList.remove('show');
                    }, 2000);
                } else {
                    // Audio file processing
                    updateProgress(20, 'Đang giải mã âm thanh...');
                    
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const arrayBuffer = await selectedFile.arrayBuffer();
                    
                    updateProgress(40, 'Đang xử lý dữ liệu...');
                    
                    const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                    
                    updateProgress(60, 'Đang chuyển đổi định dạng...');
                    
                    let blob;
                    if (format === 'wav') {
                        blob = await convertToWAV(audioBuffer);
                    } else {
                        blob = await convertWithMediaRecorder(audioBuffer, format);
                    }
                    
                    updateProgress(90, 'Hoàn tất...');
                    
                    audioContext.close();
                    
                    updateProgress(100, 'Chuyển đổi thành công!');
                    
                    // Create download
                    const downloadUrl = URL.createObjectURL(blob);
                    const originalName = selectedFile.name.replace(/\.[^/.]+$/, '');
                    downloadBtn.href = downloadUrl;
                    downloadBtn.download = `${originalName}.${format}`;
                    
                    result.classList.add('show');
                    showStatus('✅ Hoàn tất! File đã sẵn sàng tải xuống.', 'success');
                    
                    setTimeout(() => {
                        progressContainer.classList.remove('show');
                    }, 2000);
                }
                
            } catch (error) {
                console.error('Error:', error);
                showStatus('❌ Lỗi: ' + (error.message || 'Không thể xử lý file này. Thử định dạng khác!'), 'error');
                progressContainer.classList.remove('show');
            } finally {
                convertBtn.disabled = false;
            }
        });
        
        function updateProgress(percent, text) {
            progressFill.style.width = percent + '%';
            progressText.textContent = text + ' (' + percent + '%)';
        }
        
        function convertToWAV(audioBuffer) {
            return new Promise((resolve) => {
                const numberOfChannels = audioBuffer.numberOfChannels;
                const sampleRate = audioBuffer.sampleRate;
                const length = audioBuffer.length * numberOfChannels * 2;
                const buffer = new ArrayBuffer(44 + length);
                const view = new DataView(buffer);
                
                // Write WAV header
                writeString(view, 0, 'RIFF');
                view.setUint32(4, 36 + length, true);
                writeString(view, 8, 'WAVE');
                writeString(view, 12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, 1, true);
                view.setUint16(22, numberOfChannels, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * numberOfChannels * 2, true);
                view.setUint16(32, numberOfChannels * 2, true);
                view.setUint16(34, 16, true);
                writeString(view, 36, 'data');
                view.setUint32(40, length, true);
                
                // Write audio data in chunks for better performance
                const channels = [];
                for (let i = 0; i < numberOfChannels; i++) {
                    channels.push(audioBuffer.getChannelData(i));
                }
                
                let offset = 44;
                const chunkSize = 4096;
                
                for (let i = 0; i < audioBuffer.length; i += chunkSize) {
                    const end = Math.min(i + chunkSize, audioBuffer.length);
                    for (let j = i; j < end; j++) {
                        for (let ch = 0; ch < numberOfChannels; ch++) {
                            const sample = Math.max(-1, Math.min(1, channels[ch][j]));
                            view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
                            offset += 2;
                        }
                    }
                }
                
                resolve(new Blob([buffer], { type: 'audio/wav' }));
            });
        }
        
        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }
        
        async function convertWithMediaRecorder(audioBuffer, format) {
            return new Promise((resolve, reject) => {
                const sampleRate = audioBuffer.sampleRate;
                const offlineContext = new OfflineAudioContext(
                    audioBuffer.numberOfChannels,
                    audioBuffer.length,
                    sampleRate
                );
                
                const source = offlineContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(offlineContext.destination);
                source.start(0);
                
                offlineContext.startRendering().then(renderedBuffer => {
                    const mediaStream = createMediaStreamFromBuffer(renderedBuffer);
                    
                    const mimeTypes = {
                        'mp3': 'audio/mpeg',
                        'ogg': 'audio/ogg; codecs=opus',
                        'webm': 'audio/webm; codecs=opus'
                    };
                    
                    let mimeType = mimeTypes[format];
                    
                    // Fallback if format not supported
                    if (!MediaRecorder.isTypeSupported(mimeType)) {
                        mimeType = 'audio/webm';
                    }
                    
                    const mediaRecorder = new MediaRecorder(mediaStream, {
                        mimeType: mimeType,
                        audioBitsPerSecond: 128000
                    });
                    
                    const chunks = [];
                    
                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) chunks.push(e.data);
                    };
                    
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(chunks, { type: mimeType });
                        resolve(blob);
                    };
                    
                    mediaRecorder.onerror = (e) => {
                        reject(new Error('Không thể chuyển đổi sang định dạng này'));
                    };
                    
                    mediaRecorder.start();
                    setTimeout(() => {
                        mediaRecorder.stop();
                    }, (renderedBuffer.duration + 0.5) * 1000);
                });
            });
        }
        
        function createMediaStreamFromBuffer(audioBuffer) {
            const audioContext = new AudioContext();
            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            
            const destination = audioContext.createMediaStreamDestination();
            source.connect(destination);
            source.start(0);
            
            return destination.stream;
        }
        
        async function convertVideoToAudio(file, format) {
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                const url = URL.createObjectURL(file);
                video.src = url;
                video.muted = false;
                
                video.onloadedmetadata = () => {
                    updateProgress(30, 'Đang trích xuất âm thanh từ video...');
                    
                    // Create audio context
                    const audioContext = new AudioContext();
                    const source = audioContext.createMediaElementSource(video);
                    const destination = audioContext.createMediaStreamDestination();
                    source.connect(destination);
                    
                    updateProgress(50, 'Đang ghi âm...');
                    
                    // Setup MediaRecorder
                    const mimeTypes = {
                        'mp3': 'audio/webm',
                        'ogg': 'audio/ogg; codecs=opus',
                        'webm': 'audio/webm; codecs=opus',
                        'wav': 'audio/webm'
                    };
                    
                    const mimeType = mimeTypes[format] || 'audio/webm';
                    const mediaRecorder = new MediaRecorder(destination.stream, {
                        mimeType: mimeType,
                        audioBitsPerSecond: 128000
                    });
                    
                    const chunks = [];
                    
                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) {
                            chunks.push(e.data);
                        }
                    };
                    
                    mediaRecorder.onstop = () => {
                        updateProgress(80, 'Đang hoàn thiện file...');
                        const blob = new Blob(chunks, { type: mimeType });
                        URL.revokeObjectURL(url);
                        audioContext.close();
                        resolve(blob);
                    };
                    
                    mediaRecorder.onerror = (e) => {
                        URL.revokeObjectURL(url);
                        reject(new Error('Không thể ghi âm từ video'));
                    };
                    
                    // Start recording and play video
                    mediaRecorder.start();
                    video.play();
                    
                    video.onended = () => {
                        mediaRecorder.stop();
                    };
                };
                
                video.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('Không thể đọc file video/webm này'));
                };
            });
        }
        
        function showStatus(message, type) {
            status.textContent = message;
            status.className = 'status show ' + type;
        }
    </script>
</body>
</html>
